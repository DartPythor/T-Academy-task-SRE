[project]
name = "t-academy-task-sre"
version = "0.1.0"
description = "Сервис для анализа вакансий: сбор, метрики, CRUD"
authors = [
    {name = "DarthByte", email = "neverovm28@gmail.com"}
]
readme = "README.md"
requires-python = "^3.13"
dependencies = [
    "sqlalchemy[asyncio] (>=2.1.1,<3.0.0)",
    "fastapi (>=0.115.0,<1.0.0)",
    "uvicorn[standard] (>=0.30.0,<1.0.0)",
    "pydantic (>=2.10.0,<3.0.0)",
    "pydantic-settings (>=2.6.0,<3.0.0)",
    "asyncpg (>=0.30.0,<1.0.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "t-academy-task-sre"
version = "0.1.0"
description = "Сервис для анализа вакансий: сбор, метрики, CRUD"
authors = ["DarthByte <neverovm28@gmail.com>"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"
pytest-cov = "^5.0"
ruff = "^0.7"
mypy = "^1.13"

[tool.poetry.scripts]
manage = "backend.manage:cli"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-select = ["I"]
fix = true
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["backend"]
