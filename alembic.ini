
[alembic]
# %(here)s is the directory that contains this file, so migrations work
# regardless of the current working directory of the process.
# NOTE: this file is read with the system locale encoding (configparser
# "locale" mode), therefore it must stay ASCII-only.
script_location = %(here)s/alembic

# Project root is added to sys.path - required to import backend.*
prepend_sys_path = %(here)s

path_separator = os

# NOT used: the real DSN comes from the VA_DB_DSN environment variable,
# see alembic/env.py. Secrets are never stored in config files.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
