
services:
  backend:
    environment:
      VA_DEBUG: "true"
      VA_LOG_LEVEL: "DEBUG"
    volumes:
      - ./backend:/app/backend
    command: uvicorn backend.main:app --reload --host 0.0.0.0 --port 8000 --log-level debug

  frontend:
    build:
      dockerfile: frontend/Dockerfile.dev
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html

  db:
    ports:
      - "5432:5432"
